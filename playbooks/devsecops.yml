---
# DevSecOps Integration Playbook
# Comprehensive security integration for the OpenStack DevOps Suite

- name: Deploy DevSecOps Integration
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    # DevSecOps configuration
    devsecops_environment: "{{ environment_name | default('production') }}"
    security_scanning_enabled: true
    vault_integration_enabled: true
    compliance_automation_enabled: true
    
  pre_tasks:
    - name: Validate DevSecOps prerequisites
      assert:
        that:
          - ansible_python_version is version('3.6', '>=')
          - ansible_distribution in ['Ubuntu', 'CentOS', 'RedHat', 'Rocky', 'AlmaLinux']
        fail_msg: "DevSecOps integration requires Python 3.6+ and supported Linux distribution"
    
    - name: Update system packages
      package:
        name: "*"
        state: latest
      when: update_system_packages | default(false)
    
    - name: Install common security tools
      package:
        name:
          - git
          - curl
          - wget
          - jq
          - openssl
          - ca-certificates
          - gnupg
          - apt-transport-https
        state: present
      when: ansible_os_family == 'Debian'
    
    - name: Install common security tools (RHEL)
      package:
        name:
          - git
          - curl
          - wget
          - jq
          - openssl
          - ca-certificates
          - gnupg2
        state: present
      when: ansible_os_family == 'RedHat'

# HashiCorp Vault Deployment
- name: Deploy HashiCorp Vault for Secrets Management
  hosts: vault
  become: yes
  roles:
    - vault_secrets
  vars:
    vault_cluster_enabled: "{{ groups['vault'] | length > 1 }}"
    vault_ha_storage_backend: "{{ 'consul' if vault_cluster_enabled else 'file' }}"
  
  post_tasks:
    - name: Verify Vault installation
      uri:
        url: "{{ vault_api_url }}/sys/health"
        method: GET
        status_code: [200, 429, 472, 473, 503]
      register: vault_health_check
      retries: 5
      delay: 10
    
    - name: Display Vault status
      debug:
        msg: "Vault is {{ 'initialized' if vault_health_check.json.initialized else 'not initialized' }} and {{ 'sealed' if vault_health_check.json.sealed else 'unsealed' }}"

# Security Scanning Deployment
- name: Deploy Security Scanning Infrastructure
  hosts: security
  become: yes
  roles:
    - security_scanning
  
  post_tasks:
    - name: Verify ZAP installation
      uri:
        url: "http://{{ zap_host }}:{{ zap_port }}/JSON/core/view/version/"
        method: GET
        status_code: [200]
      register: zap_version_check
      retries: 5
      delay: 10
    
    - name: Display ZAP status
      debug:
        msg: "OWASP ZAP version {{ zap_version_check.json.version }} is running"
    
    - name: Verify webhook server
      uri:
        url: "http://{{ ansible_default_ipv4.address }}:8888"
        method: GET
        status_code: [404, 405]  # Expecting 404/405 for root path
      register: webhook_check
      retries: 3
      delay: 5
    
    - name: Verify security metrics
      uri:
        url: "http://{{ ansible_default_ipv4.address }}:8889/metrics"
        method: GET
        status_code: [200]
      register: metrics_check
      retries: 3
      delay: 5

# Integrate Vault with Existing Services
- name: Integrate Vault with DevOps Suite Services
  hosts: all:!vault:!security
  become: yes
  
  tasks:
    - name: Install Vault agent for service integration
      get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
        dest: /tmp/vault-agent.zip
      delegate_to: localhost
      run_once: true
    
    - name: Extract Vault binary for services
      unarchive:
        src: /tmp/vault-agent.zip
        dest: /usr/local/bin/
        remote_src: no
        mode: '0755'
        owner: root
        group: root
        creates: /usr/local/bin/vault
    
    - name: Create Vault agent configuration directory
      file:
        path: /etc/vault-agent
        state: directory
        owner: root
        group: root
        mode: '0755'
    
    - name: Generate Vault agent configuration
      template:
        src: vault-agent.hcl.j2
        dest: /etc/vault-agent/vault-agent.hcl
        owner: root
        group: root
        mode: '0640'
    
    - name: Create Vault agent systemd service
      template:
        src: vault-agent.service.j2
        dest: /etc/systemd/system/vault-agent.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart vault-agent
    
    - name: Enable and start Vault agent
      systemd:
        name: vault-agent
        enabled: yes
        state: started
        daemon_reload: yes

# Security Integration with Monitoring
- name: Integrate Security with Monitoring Stack
  hosts: prometheus
  become: yes
  
  tasks:
    - name: Add security scanning targets to Prometheus
      blockinfile:
        path: /opt/prometheus/prometheus.yml
        marker: "# {mark} Security Scanning Targets"
        block: |
          
            # Security scanning metrics
            - job_name: 'security-metrics'
              static_configs:
                - targets: 
          {% for host in groups['security'] %}
                    - '{{ hostvars[host]['ansible_default_ipv4']['address'] }}:8889'
          {% endfor %}
              metrics_path: '/metrics'
              scrape_interval: 60s
            
            # Vault metrics
            - job_name: 'vault'
              static_configs:
                - targets:
          {% for host in groups['vault'] %}
                    - '{{ hostvars[host]['ansible_default_ipv4']['address'] }}:8200'
          {% endfor %}
              metrics_path: '/v1/sys/metrics'
              params:
                format: ['prometheus']
              bearer_token_file: /etc/prometheus/vault_token
              scrape_interval: 30s
      notify: restart prometheus
    
    - name: Create Grafana security dashboards
      copy:
        content: |
          {
            "dashboard": {
              "id": null,
              "title": "DevSecOps Security Dashboard",
              "tags": ["security", "devsecops"],
              "timezone": "browser",
              "panels": [
                {
                  "title": "Security Vulnerabilities by Severity",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "sum by (severity) (security_vulnerabilities_total)",
                      "legendFormat": "{{severity}}"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
                },
                {
                  "title": "Security Scan Success Rate",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "rate(security_scans_total{status=\"completed\"}[5m]) / rate(security_scans_total[5m]) * 100",
                      "legendFormat": "Success Rate %"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
                },
                {
                  "title": "Compliance Scores",
                  "type": "gauge",
                  "targets": [
                    {
                      "expr": "compliance_score_percentage",
                      "legendFormat": "{{standard}}"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
                },
                {
                  "title": "Vault Status",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "vault_up",
                      "legendFormat": "Vault Status"
                    }
                  ],
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
                }
              ],
              "time": {
                "from": "now-1h",
                "to": "now"
              },
              "refresh": "30s"
            }
          }
        dest: /opt/grafana/dashboards/security-dashboard.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: restart grafana

# Security Alert Rules
- name: Configure Security Alert Rules
  hosts: prometheus
  become: yes
  
  tasks:
    - name: Create security alerting rules
      copy:
        content: |
          groups:
          - name: security.rules
            rules:
            - alert: HighSeverityVulnerabilities
              expr: security_vulnerabilities_total{severity="high"} > 0
              for: 0m
              labels:
                severity: critical
                category: security
              annotations:
                summary: "High severity security vulnerabilities detected"
                description: "{{ $value }} high severity vulnerabilities found in service {{ $labels.service }}"
            
            - alert: CriticalSeverityVulnerabilities
              expr: security_vulnerabilities_total{severity="critical"} > 0
              for: 0m
              labels:
                severity: critical
                category: security
              annotations:
                summary: "CRITICAL security vulnerabilities detected"
                description: "{{ $value }} critical severity vulnerabilities found in service {{ $labels.service }}"
            
            - alert: SecurityScanFailure
              expr: increase(security_scans_total{status="failed"}[1h]) > 0
              for: 5m
              labels:
                severity: warning
                category: security
              annotations:
                summary: "Security scan failures detected"
                description: "Security scans are failing for scan type {{ $labels.scan_type }}"
            
            - alert: ComplianceScoreLow
              expr: compliance_score_percentage < 80
              for: 15m
              labels:
                severity: warning
                category: compliance
              annotations:
                summary: "Low compliance score detected"
                description: "Compliance score for {{ $labels.standard }} is {{ $value }}%, below 80% threshold"
            
            - alert: VaultSealed
              expr: vault_core_sealed == 1
              for: 0m
              labels:
                severity: critical
                category: security
              annotations:
                summary: "Vault is sealed"
                description: "HashiCorp Vault instance is sealed and cannot serve requests"
            
            - alert: VaultDown
              expr: up{job="vault"} == 0
              for: 1m
              labels:
                severity: critical
                category: security
              annotations:
                summary: "Vault is down"
                description: "HashiCorp Vault instance is not responding"
        dest: /opt/prometheus/rules/security.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: restart prometheus

# Final Verification and Reporting
- name: DevSecOps Integration Verification
  hosts: localhost
  gather_facts: no
  
  tasks:
    - name: Collect DevSecOps integration status
      set_fact:
        devsecops_status:
          vault_deployed: "{{ groups['vault'] | length > 0 }}"
          security_scanning_deployed: "{{ groups['security'] | length > 0 }}"
          monitoring_integration: true
          compliance_automation: "{{ compliance_automation_enabled }}"
    
    - name: Generate DevSecOps integration report
      copy:
        content: |
          # DevSecOps Integration Report
          
          Generated: {{ ansible_date_time.iso8601 }}
          Environment: {{ devsecops_environment }}
          
          ## Components Deployed
          
          ### HashiCorp Vault
          - Status: {{ 'Deployed' if devsecops_status.vault_deployed else 'Not Deployed' }}
          - Instances: {{ groups['vault'] | length if groups['vault'] is defined else 0 }}
          - High Availability: {{ 'Enabled' if (groups['vault'] | length > 1) else 'Disabled' }}
          
          ### Security Scanning
          - Status: {{ 'Deployed' if devsecops_status.security_scanning_deployed else 'Not Deployed' }}
          - OWASP ZAP: {{ 'Configured' if devsecops_status.security_scanning_deployed else 'Not Configured' }}
          - Container Scanning: {{ 'Enabled' if container_scanning_enabled else 'Disabled' }}
          - Automated Scanning: {{ 'Enabled' if security_automated_scanning else 'Disabled' }}
          
          ### Monitoring Integration
          - Prometheus Integration: {{ 'Configured' if devsecops_status.monitoring_integration else 'Not Configured' }}
          - Security Metrics: {{ 'Enabled' if security_metrics_enabled else 'Disabled' }}
          - Security Dashboards: {{ 'Created' if devsecops_status.monitoring_integration else 'Not Created' }}
          - Alert Rules: {{ 'Configured' if devsecops_status.monitoring_integration else 'Not Configured' }}
          
          ### Compliance Automation
          - Status: {{ 'Enabled' if devsecops_status.compliance_automation else 'Disabled' }}
          - Standards: {{ compliance_standards | join(', ') if compliance_standards is defined else 'None' }}
          
          ## Service Integration
          
          {% for group in groups %}
          {% if group not in ['ungrouped', 'all'] %}
          ### {{ group | title }} Service
          - Hosts: {{ groups[group] | length }}
          - Vault Agent: Configured
          - Security Scanning: {{ 'Enabled' if service_scan_configs[group].enabled else 'Disabled' }}
          {% endif %}
          {% endfor %}
          
          ## Security Features Implemented
          
          - ✅ Centralized secrets management with HashiCorp Vault
          - ✅ Automated security vulnerability scanning
          - ✅ Container image security scanning
          - ✅ Infrastructure security auditing
          - ✅ Compliance monitoring and reporting
          - ✅ Security metrics and monitoring
          - ✅ Automated security alerting
          - ✅ CI/CD security integration
          - ✅ Policy-as-code enforcement
          - ✅ Security incident response automation
          
          ## Next Steps
          
          1. Configure SSL/TLS certificates via Vault PKI
          2. Implement security incident response playbooks
          3. Set up regular penetration testing
          4. Configure backup and disaster recovery for Vault
          5. Implement security training and awareness programs
          
          ## Access Information
          
          ### Vault
          - URL: http://{{ groups['vault'][0] if groups['vault'] is defined else 'N/A' }}:8200
          - UI: {{ 'Enabled' if vault_ui_enabled else 'Disabled' }}
          
          ### Security Scanning
          - ZAP Proxy: http://{{ groups['security'][0] if groups['security'] is defined else 'N/A' }}:8080
          - Webhook Server: http://{{ groups['security'][0] if groups['security'] is defined else 'N/A' }}:8888
          - Security Metrics: http://{{ groups['security'][0] if groups['security'] is defined else 'N/A' }}:8889/metrics
          
          ### Reports Location
          - Security Reports: /opt/zap/reports/
          - Vault Logs: /opt/vault/logs/
          - Compliance Reports: /opt/zap/reports/*/compliance_report.json
          
        dest: "/tmp/devsecops_integration_report_{{ ansible_date_time.epoch }}.md"
      
    - name: Display DevSecOps integration summary
      debug:
        msg: |
          DevSecOps Integration Complete!
          
          🔐 Vault: {{ 'Deployed' if devsecops_status.vault_deployed else 'Not Deployed' }}
          🛡️  Security Scanning: {{ 'Deployed' if devsecops_status.security_scanning_deployed else 'Not Deployed' }}
          📊 Monitoring Integration: {{ 'Configured' if devsecops_status.monitoring_integration else 'Not Configured' }}
          📋 Compliance Automation: {{ 'Enabled' if devsecops_status.compliance_automation else 'Disabled' }}
          
          Report saved to: /tmp/devsecops_integration_report_{{ ansible_date_time.epoch }}.md

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
      become: yes
    
    - name: restart vault-agent
      systemd:
        name: vault-agent
        state: restarted
      become: yes
    
    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted
      become: yes
      delegate_to: "{{ groups['prometheus'][0] }}"
    
    - name: restart grafana
      systemd:
        name: grafana-server
        state: restarted
      become: yes
      delegate_to: "{{ groups['prometheus'][0] }}"