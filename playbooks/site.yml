---
# Main site playbook for deploying the entire OpenStack DevOps Suite
# Enterprise-grade DevOps platform with observability, security, and modernization

- name: Ensure OpenStack VMs are provisioned
  hosts: all
  gather_facts: false
  become: false
  tags: 
    - provision
    - infrastructure
  roles:
    - openstack_vm

- name: Configure baseline settings for all hosts
  hosts: all
  gather_facts: true
  become: true
  tags: 
    - baseline
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install common packages
      package:
        name:
          - htop
          - iotop
          - curl
          - wget
          - unzip
          - ntp
          - vim
          - curl
          - wget
          - rsync
          - git
          - unzip
          - ca-certificates
          - python3
          - python3-pip
          - jq
        state: present

    - name: Set timezone
      timezone:
        name: UTC

    - name: Configure firewall defaults
      ufw:
        state: enabled
        policy: deny
        direction: incoming
      when: ansible_os_family == 'Debian'
      
    - name: Allow SSH connections
      ufw:
        rule: allow
        name: OpenSSH
      when: ansible_os_family == 'Debian'

- name: Deploy GitLab SCM and Project Management
  import_playbook: gitlab.yml

- name: Deploy Rancher Kubernetes Management
  import_playbook: rancher.yml

- name: Deploy Keycloak IAM
  import_playbook: keycloak.yml

- name: Deploy Nexus Repository
  import_playbook: nexus.yml

- name: Deploy Kafka Message Broker
  import_playbook: kafka.yml

- name: Deploy Redis Cache
  import_playbook: redis.yml

# Deploy Enterprise DevOps Platform Components

# 1. Secrets Management (Deploy first - required by other services)
- name: Deploy HashiCorp Vault Secrets Management
  import_playbook: vault.yml
  tags:
    - vault
    - secrets
    - security

# 2. Monitoring and Observability Stack
- name: Deploy Prometheus Monitoring Stack
  import_playbook: prometheus.yml
  tags:
    - monitoring
    - prometheus
    - alerting

- name: Deploy Grafana Visualization
  import_playbook: grafana.yml
  tags:
    - grafana
    - dashboards
    - visualization

- name: Deploy ELK Centralized Logging
  import_playbook: elasticsearch.yml
  tags:
    - logging
    - elk
    - elasticsearch

- name: Deploy Jaeger Distributed Tracing
  import_playbook: jaeger.yml
  tags:
    - tracing
    - jaeger
    - observability

# 3. GitOps and CI/CD
- name: Deploy ArgoCD GitOps Framework
  import_playbook: argocd.yml
  tags:
    - gitops
    - argocd
    - cicd

# 4. Security and Compliance
- name: Deploy Security Scanning
  import_playbook: security.yml
  tags:
    - security
    - scanning
    - compliance

# 5. API Gateway and Enterprise Integration
- name: Deploy Kong API Gateway
  import_playbook: api_gateway.yml
  tags:
    - api_gateway
    - kong
    - enterprise

- name: Configure Nginx Proxy
  hosts: nginx_servers
  become: true
  tags:
    - nginx
    - proxy
    - dashboard
  roles:
    - nginx_proxy
