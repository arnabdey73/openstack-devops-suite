---
# API Gateway & Enterprise Integration Playbook
# Deploys Kong API Gateway with enterprise-grade features

- name: Deploy API Gateway Infrastructure
  hosts: nginx
  become: yes
  gather_facts: yes
  
  vars:
    api_gateway_environment: "{{ environment_name | default('production') }}"
    
  pre_tasks:
    - name: Validate API Gateway prerequisites
      assert:
        that:
          - groups['nginx'] is defined
          - groups['nginx'] | length > 0
        fail_msg: "API Gateway requires nginx hosts to be defined"
    
    - name: Install PostgreSQL for Kong database
      package:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
    
    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes
    
    - name: Create Kong database
      become_user: postgres
      postgresql_db:
        name: "{{ kong_database_name }}"
        encoding: UTF-8
        state: present
    
    - name: Create Kong database user
      become_user: postgres
      postgresql_user:
        name: "{{ kong_database_user }}"
        password: "{{ kong_database_password }}"
        db: "{{ kong_database_name }}"
        priv: ALL
        state: present
        no_log: true

  roles:
    - api_gateway
  
  post_tasks:
    - name: Verify Kong installation
      uri:
        url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}"
        method: GET
        status_code: [200]
      register: kong_health
      retries: 5
      delay: 10
    
    - name: Display Kong version
      debug:
        msg: "Kong Gateway {{ kong_health.json.version }} is running"
    
    - name: Test service routing
      uri:
        url: "http://{{ kong_proxy_host }}:{{ kong_proxy_port }}"
        method: GET
        headers:
          Host: "gitlab.{{ kong_domain }}"
        status_code: [200, 302, 404]  # 404 is ok as service might not be fully configured
      register: routing_test
      ignore_errors: yes
    
    - name: Create enterprise integration summary
      copy:
        content: |
          # API Gateway & Enterprise Integration Summary
          
          Generated: {{ ansible_date_time.iso8601 }}
          Environment: {{ api_gateway_environment }}
          
          ## Kong API Gateway
          
          ### Access Information
          - Admin API: http://{{ kong_admin_host }}:{{ kong_admin_port }}
          - Proxy: http://{{ kong_proxy_host }}:{{ kong_proxy_port }}
          - Admin GUI: http://{{ kong_admin_host }}:1337 (if Konga is enabled)
          
          ### Service Endpoints
          - GitLab: http://gitlab.{{ kong_domain }}/gitlab
          - Nexus: http://nexus.{{ kong_domain }}/nexus  
          - Keycloak: http://auth.{{ kong_domain }}/auth
          - Rancher: http://rancher.{{ kong_domain }}/rancher
          - Grafana: http://grafana.{{ kong_domain }}/grafana
          - Prometheus: http://prometheus.{{ kong_domain }}/prometheus
          - API Gateway: http://api.{{ kong_domain }}/v1
          
          ### Security Features
          - ✅ Rate limiting ({{ kong_rate_limit_minute }}/min, {{ kong_rate_limit_hour }}/hour)
          - ✅ CORS protection
          - ✅ Request size limiting ({{ kong_max_request_size }} bytes)
          - ✅ JWT authentication for APIs
          - ✅ Bot detection and protection
          - ✅ IP restriction (if enabled)
          - ✅ OAuth2 integration
          - ✅ SSL/TLS termination
          
          ### Monitoring & Observability
          - ✅ Prometheus metrics export
          - ✅ Request/response logging
          - ✅ Health checks for upstream services
          - ✅ Performance monitoring
          - ✅ Traffic analytics
          
          ### Plugins Enabled
          {% for plugin in kong_plugins_list.json.data %}
          - {{ plugin.name }}
          {% endfor %}
          
          ## Enterprise Features
          
          ### Load Balancing
          - Algorithm: Round-robin
          - Health checks: Active and passive
          - Failover: Automatic
          
          ### Security
          - Authentication: JWT, OAuth2, Basic Auth
          - Authorization: Role-based access control
          - Rate limiting: Per consumer and global
          - DDoS protection: Built-in
          
          ### API Management
          - Version management: Header-based routing
          - Request/response transformation
          - Protocol translation (HTTP/HTTPS)
          - Service mesh capabilities
          
          ### Integration Points
          - Vault: Secret management integration
          - Monitoring: Prometheus metrics export
          - Logging: Centralized audit logging
          - CI/CD: Webhook endpoints for automation
          
          ## Usage Examples
          
          ### API Authentication
          ```bash
          # Get JWT token from Keycloak
          TOKEN=$(curl -X POST "http://auth.{{ kong_domain }}/auth/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=admin&grant_type=password&client_id=admin-cli" | jq -r '.access_token')
          
          # Use token to access API
          curl -H "Authorization: Bearer $TOKEN" "http://api.{{ kong_domain }}/v1/health"
          ```
          
          ### Service Access
          ```bash
          # Access GitLab through API Gateway
          curl -H "Host: gitlab.{{ kong_domain }}" "http://{{ kong_proxy_host }}:{{ kong_proxy_port }}/gitlab"
          
          # Access Grafana with custom headers
          curl -H "Host: grafana.{{ kong_domain }}" "http://{{ kong_proxy_host }}:{{ kong_proxy_port }}/grafana/api/health"
          ```
          
          ### Monitoring
          ```bash
          # Get Kong metrics
          curl "http://{{ kong_admin_host }}:{{ kong_admin_port }}/metrics"
          
          # Check service health
          curl "http://{{ kong_admin_host }}:{{ kong_admin_port }}/upstreams/gitlab-upstream/health"
          ```
          
          ## Next Steps
          
          1. Configure custom SSL certificates
          2. Set up advanced rate limiting policies
          3. Implement API versioning strategies
          4. Configure advanced authentication methods
          5. Set up API analytics and reporting
          6. Implement service mesh features
          7. Configure disaster recovery and backup
          
        dest: "/tmp/api_gateway_summary_{{ ansible_date_time.epoch }}.md"
    
    - name: Display API Gateway summary
      debug:
        msg: |
          🚀 API Gateway Deployment Complete!
          
          📊 Admin API: http://{{ kong_admin_host }}:{{ kong_admin_port }}
          🌐 Proxy: http://{{ kong_proxy_host }}:{{ kong_proxy_port }}
          🔒 Security: JWT, OAuth2, Rate Limiting Enabled
          📈 Monitoring: Prometheus metrics available
          🏢 Services: {{ kong_services_list.json.data | length if kong_services_list is defined else 'N/A' }} configured
          
          Summary saved to: /tmp/api_gateway_summary_{{ ansible_date_time.epoch }}.md

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
    
    - name: restart kong
      systemd:
        name: kong
        state: restarted