---
# Kong handlers

- name: Restart kong
  service:
    name: kong
    state: restarted
    enabled: yes
  become: yes

- name: Reload kong
  service:
    name: kong
    state: reloaded
  become: yes
  ignore_errors: yes

- name: Start kong
  service:
    name: kong
    state: started
    enabled: yes
  become: yes

- name: Stop kong
  service:
    name: kong
    state: stopped
  become: yes

- name: Restart postgresql
  service:
    name: postgresql
    state: restarted
    enabled: yes
  become: yes

- name: Restart nginx
  service:
    name: nginx
    state: restarted
    enabled: yes
  become: yes
  ignore_errors: yes

- name: Reload nginx
  service:
    name: nginx
    state: reloaded
  become: yes
  ignore_errors: yes

- name: Update kong configuration
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/config"
    method: POST
    body_format: json
    body:
      _format_version: "3.0"
    timeout: 30
  ignore_errors: yes

- name: Refresh kong cache
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/cache"
    method: DELETE
  ignore_errors: yes

- name: Wait for kong to be ready
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/status"
    method: GET
  register: kong_status
  retries: 30
  delay: 10
  until: kong_status.status == 200
  ignore_errors: yes

- name: Validate kong configuration
  shell: /usr/local/bin/kong check /etc/kong/kong.conf
  become: yes
  ignore_errors: yes

- name: Restart konga
  service:
    name: konga
    state: restarted
    enabled: yes
  become: yes
  when: konga_installed is defined and konga_installed.changed

- name: Clean kong cache
  file:
    path: /var/cache/kong
    state: absent
  become: yes
  ignore_errors: yes

- name: Recreate kong cache directory
  file:
    path: /var/cache/kong
    state: directory
    owner: kong
    group: kong
    mode: '0755'
  become: yes
  ignore_errors: yes