---
# Configure Kong services and routes for DevOps Suite

- name: Configure GitLab service
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/services"
    method: POST
    body_format: json
    body:
      name: gitlab-service
      url: "http://{{ groups['gitlab'][0] }}:8090"
      protocol: http
      host: "{{ groups['gitlab'][0] }}"
      port: 8090
      path: "/"
    status_code: [201, 409]
  register: gitlab_service

- name: Create GitLab route
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/services/gitlab-service/routes"
    method: POST
    body_format: json
    body:
      name: gitlab-route
      protocols: ["http", "https"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
      hosts: ["gitlab.{{ kong_domain }}"]
      paths: ["/gitlab"]
      strip_path: true
    status_code: [201, 409]

