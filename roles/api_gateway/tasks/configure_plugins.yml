---
# Configure Kong plugins for security, rate limiting, and monitoring

- name: Enable rate limiting plugin globally
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: rate-limiting
      config:
        minute: "{{ kong_rate_limit_minute }}"
        hour: "{{ kong_rate_limit_hour }}"
        day: "{{ kong_rate_limit_day }}"
        policy: "{{ kong_rate_limit_policy }}"
        fault_tolerant: true
        hide_client_headers: false
    status_code: [201, 409]

- name: Enable CORS plugin globally
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: cors
      config:
        origins: "{{ kong_cors_origins }}"
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Auth-Token", "Authorization"]
        exposed_headers: ["X-Auth-Token"]
        credentials: true
        max_age: 3600
    status_code: [201, 409]

- name: Enable request size limiting plugin
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: request-size-limiting
      config:
        allowed_payload_size: "{{ kong_max_request_size }}"
    status_code: [201, 409]

- name: Enable IP restriction plugin for admin endpoints
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: ip-restriction
      config:
        allow: "{{ kong_admin_allowed_ips }}"
      enabled: "{{ kong_ip_restriction_enabled }}"
    status_code: [201, 409]
  when: kong_ip_restriction_enabled | default(false)

- name: Enable Prometheus monitoring plugin
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: prometheus
      config:
        per_consumer: true
        status_code_metrics: true
        latency_metrics: true
        bandwidth_metrics: true
        upstream_health_metrics: true
    status_code: [201, 409]
  when: kong_prometheus_plugin_enabled | default(true)

- name: Enable request logging for audit
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: http-log
      config:
        http_endpoint: "http://{{ groups['elasticsearch'][0] if groups['elasticsearch'] is defined else groups['prometheus'][0] }}:9200/kong-logs/_doc"
        method: "POST"
        content_type: "application/json"
        timeout: 10000
        keepalive: 60000
    status_code: [201, 409]
  when: kong_audit_logging_enabled | default(true)

- name: Configure JWT authentication for API routes
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/services/api-service/plugins"
    method: POST
    body_format: json
    body:
      name: jwt
      config:
        uri_param_names: ["jwt"]
        cookie_names: ["jwt"]
        header_names: ["Authorization"]
        claims_to_verify: ["exp"]
        key_claim_name: "iss"
        secret_is_base64: false
        anonymous: ""
        run_on_preflight: true
    status_code: [201, 409]
  when: kong_jwt_auth_enabled | default(true)

- name: Configure OAuth2 for GitLab integration
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/services/gitlab-service/plugins"
    method: POST
    body_format: json
    body:
      name: oauth2
      config:
        scopes: ["read", "write", "admin"]
        token_expiration: 7200
        enable_authorization_code: true
        enable_client_credentials: true
        enable_implicit_grant: false
        enable_password_grant: false
        hide_credentials: true
        accept_http_if_already_terminated: true
    status_code: [201, 409]
  when: kong_oauth2_enabled | default(false)

- name: Configure response transformer for API versioning
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/services/api-service/plugins"
    method: POST
    body_format: json
    body:
      name: response-transformer
      config:
        add:
          headers: 
            - "X-API-Version:v1"
            - "X-Powered-By:Kong Gateway"
        remove:
          headers:
            - "Server"
    status_code: [201, 409]

- name: Enable bot detection plugin
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: POST
    body_format: json
    body:
      name: bot-detection
      config:
        allow: []
        deny: ["bot", "crawler", "spider", "scanner"]
    status_code: [201, 409]
  when: kong_bot_detection_enabled | default(true)

- name: Configure health check plugin for upstream services
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/upstreams"
    method: POST
    body_format: json
    body:
      name: "{{ item.name }}-upstream"
      algorithm: "round-robin"
      hash_on: "none"
      hash_fallback: "none"
      healthchecks:
        active:
          type: "http"
          http_path: "{{ item.health_path }}"
          https_verify_certificate: false
          healthy:
            interval: 30
            http_statuses: [200, 302]
            successes: 2
          unhealthy:
            interval: 30
            http_statuses: [429, 500, 502, 503, 504]
            tcp_failures: 3
            timeouts: 3
        passive:
          healthy:
            http_statuses: [200, 201, 202, 203, 204, 205, 206, 300, 301, 302, 303, 304, 307, 308]
            successes: 3
          unhealthy:
            http_statuses: [429, 500, 502, 503, 504]
            tcp_failures: 3
            timeouts: 3
    status_code: [201, 409]
  loop:
    - name: gitlab
      health_path: "/users/sign_in"
    - name: nexus
      health_path: "/service/rest/v1/status"
    - name: keycloak
      health_path: "/auth/realms/master"
    - name: grafana
      health_path: "/api/health"
    - name: prometheus
      health_path: "/-/healthy"

- name: Add targets to upstream services
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/upstreams/{{ item.name }}-upstream/targets"
    method: POST
    body_format: json
    body:
      target: "{{ item.host }}:{{ item.port }}"
      weight: 100
    status_code: [201, 409]
  loop:
    - name: gitlab
      host: "{{ groups['gitlab'][0] }}"
      port: 8090
    - name: nexus
      host: "{{ groups['nexus'][0] }}"
      port: 8081
    - name: keycloak
      host: "{{ groups['keycloak'][0] }}"
      port: 8180
    - name: grafana
      host: "{{ groups['prometheus'][0] }}"
      port: 3000
    - name: prometheus
      host: "{{ groups['prometheus'][0] }}"
      port: 9090

- name: Verify Kong plugins configuration
  uri:
    url: "http://{{ kong_admin_host }}:{{ kong_admin_port }}/plugins"
    method: GET
  register: kong_plugins_list

- name: Display enabled plugins
  debug:
    msg: "Enabled Kong plugins: {{ kong_plugins_list.json.data | map(attribute='name') | list }}"