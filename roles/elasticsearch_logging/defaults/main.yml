---
# ELK Stack Configuration for DevOps Suite Centralized Logging

# Elasticsearch Configuration
elasticsearch:
  version: "8.10.4"
  user: "elasticsearch"
  group: "elasticsearch"
  config_dir: "/etc/elasticsearch"
  data_dir: "/var/lib/elasticsearch"
  log_dir: "/var/log/elasticsearch"
  port: 9200
  cluster_port: 9300
  
  # Cluster settings
  cluster_name: "devops-suite-logging"
  node_name: "{{ inventory_hostname }}"
  network_host: "0.0.0.0"
  discovery_type: "single-node"
  
  # Memory settings
  heap_size: "1g"
  
  # Security settings
  security_enabled: false
  
# Logstash Configuration
logstash:
  version: "8.10.4"
  user: "logstash"
  group: "logstash"
  config_dir: "/etc/logstash"
  data_dir: "/var/lib/logstash"
  log_dir: "/var/log/logstash"
  port: 5044
  api_port: 9600
  
  # Pipeline settings
  pipeline_workers: "{{ ansible_processor_vcpus }}"
  pipeline_batch_size: 125
  pipeline_batch_delay: 50
  
  # Memory settings
  heap_size: "512m"

# Kibana Configuration  
kibana:
  version: "8.10.4"
  user: "kibana"
  group: "kibana"
  config_dir: "/etc/kibana"
  data_dir: "/var/lib/kibana"
  log_dir: "/var/log/kibana"
  port: 5601
  
  # Elasticsearch connection
  elasticsearch_hosts: ["http://localhost:9200"]
  
  # Server settings
  server_host: "0.0.0.0"
  server_name: "{{ inventory_hostname }}"

# Filebeat Configuration
filebeat:
  version: "8.10.4"
  user: "root"  # Needs root to read log files
  config_dir: "/etc/filebeat"
  data_dir: "/var/lib/filebeat"
  log_dir: "/var/log/filebeat"
  
  # Logstash output
  logstash_hosts: ["localhost:5044"]
  
  # Input configurations
  inputs:
    - type: "log"
      paths:
        - "/var/log/nginx/*.log"
        - "/var/log/apache2/*.log"
      fields:
        service: "webserver"
        environment: "{{ ansible_environment | default('production') }}"
      fields_under_root: true
      
    - type: "log"
      paths:
        - "/var/log/syslog"
        - "/var/log/messages"
        - "/var/log/auth.log"
      fields:
        service: "system"
        environment: "{{ ansible_environment | default('production') }}"
      fields_under_root: true
      
    - type: "log"
      paths:
        - "/opt/gitlab/embedded/service/gitlab-rails/log/*.log"
      fields:
        service: "gitlab"
        environment: "{{ ansible_environment | default('production') }}"
      fields_under_root: true
      multiline:
        pattern: '^\d{4}-\d{2}-\d{2}'
        negate: true
        match: after
        
    - type: "log"
      paths:
        - "/var/log/kafka/*.log"
      fields:
        service: "kafka"
        environment: "{{ ansible_environment | default('production') }}"
      fields_under_root: true
      
    - type: "log"
      paths:
        - "/var/log/redis/*.log"
      fields:
        service: "redis"
        environment: "{{ ansible_environment | default('production') }}"
      fields_under_root: true

# Index Templates and Patterns
elk_index_patterns:
  - name: "devops-suite-*"
    template:
      index_patterns: ["devops-suite-*"]
      settings:
        number_of_shards: 1
        number_of_replicas: 0
        index.lifecycle.name: "devops-suite-policy"
      mappings:
        properties:
          "@timestamp":
            type: "date"
          service:
            type: "keyword"
          environment:
            type: "keyword"
          message:
            type: "text"
          level:
            type: "keyword"

# Index Lifecycle Management
elk_ilm_policies:
  - name: "devops-suite-policy"
    policy:
      phases:
        hot:
          actions:
            rollover:
              max_size: "5gb"
              max_age: "7d"
        warm:
          min_age: "7d"
          actions:
            allocate:
              number_of_replicas: 0
        cold:
          min_age: "30d"
        delete:
          min_age: "90d"

# Kibana Dashboards and Visualizations
kibana_dashboards:
  - name: "DevOps Suite Logs Overview"
    description: "Main logging dashboard for the DevOps Suite"
  - name: "Security Logs Analysis"
    description: "Security-focused log analysis and alerting"
  - name: "Application Performance Logs"
    description: "Application-specific logging and performance metrics"

# Service configuration
elk_services_enabled: true
elk_services_state: "started"