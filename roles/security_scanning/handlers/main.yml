---
# Security scanning handlers

- name: reload systemd
  systemd:
    daemon_reload: yes
  become: yes

- name: restart zap
  systemd:
    name: zap
    state: restarted
  become: yes

- name: restart zap-webhook
  systemd:
    name: zap-webhook
    state: restarted
  become: yes

- name: restart security-metrics
  systemd:
    name: security-metrics
    state: restarted
  become: yes