---
# Security automation setup

- name: Install container security scanning tools
  pip:
    name:
      - docker
      - trivy-python
      - bandit
      - safety
    executable: pip3
  become: yes

- name: Create security automation scripts
  template:
    src: "{{ item }}.j2"
    dest: "/opt/zap/scripts/{{ item }}"
    owner: zap
    group: zap
    mode: '0755'
  loop:
    - container_security_scan.py
    - dependency_vulnerability_scan.py
    - infrastructure_security_audit.py
    - compliance_checker.py
  become: yes

- name: Setup Trivy for container scanning
  get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.tar.gz"
    dest: /tmp/trivy.tar.gz
  register: trivy_download

- name: Extract and install Trivy
  unarchive:
    src: /tmp/trivy.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: trivy_download is succeeded

- name: Create comprehensive security scanning script
  copy:
    content: |
      #!/bin/bash
      # Comprehensive DevOps Suite Security Scanner
      
      set -euo pipefail
      
      SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
      REPORTS_DIR="/opt/zap/reports"
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      
      # Colors
      RED='\033[0;31m'
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[0;34m'
      NC='\033[0m'
      
      log_info() {
          echo -e "${BLUE}[INFO]${NC} $1"
      }
      
      log_success() {
          echo -e "${GREEN}[SUCCESS]${NC} $1"
      }
      
      log_warning() {
          echo -e "${YELLOW}[WARNING]${NC} $1"
      }
      
      log_error() {
          echo -e "${RED}[ERROR]${NC} $1"
      }
      
      # Web application security scanning
      scan_web_applications() {
          log_info "Starting web application security scans..."
          
          local services=("gitlab:8090" "nexus:8081" "keycloak:8180" "grafana:3000")
          
          for service in "${services[@]}"; do
              IFS=':' read -r name port <<< "$service"
              local target_url="http://{{ groups[name][0] }}:${port}"
              
              log_info "Scanning ${name} at ${target_url}"
              
              python3 /opt/zap/scripts/zap_baseline_scan.py \
                  --target "${target_url}" \
                  --report-dir "${REPORTS_DIR}/${TIMESTAMP}" \
                  --report-name "${name}_security_scan" || log_warning "Scan failed for ${name}"
          done
      }
      
      # Container security scanning
      scan_containers() {
          log_info "Starting container security scans..."
          
          if command -v trivy &> /dev/null; then
              # Scan container images used in the DevOps Suite
              local images=(
                  "gitlab/gitlab-ce:latest"
                  "sonatype/nexus3:latest"
                  "quay.io/keycloak/keycloak:latest"
                  "rancher/rancher:latest"
                  "prom/prometheus:latest"
                  "grafana/grafana:latest"
              )
              
              for image in "${images[@]}"; do
                  log_info "Scanning container image: ${image}"
                  trivy image --format json --output "${REPORTS_DIR}/${TIMESTAMP}/$(echo ${image} | tr '/' '_' | tr ':' '_')_scan.json" "${image}" || log_warning "Container scan failed for ${image}"
              done
          else
              log_warning "Trivy not available, skipping container scans"
          fi
      }
      
      # Infrastructure security audit
      audit_infrastructure() {
          log_info "Starting infrastructure security audit..."
          
          python3 /opt/zap/scripts/infrastructure_security_audit.py \
              --output "${REPORTS_DIR}/${TIMESTAMP}/infrastructure_audit.json" \
              --format json
      }
      
      # Dependency vulnerability scanning
      scan_dependencies() {
          log_info "Starting dependency vulnerability scans..."
          
          python3 /opt/zap/scripts/dependency_vulnerability_scan.py \
              --output "${REPORTS_DIR}/${TIMESTAMP}/dependency_scan.json"
      }
      
      # Compliance checking
      check_compliance() {
          log_info "Starting compliance checks..."
          
          python3 /opt/zap/scripts/compliance_checker.py \
              --standards "OWASP,NIST,CIS" \
              --output "${REPORTS_DIR}/${TIMESTAMP}/compliance_report.json"
      }
      
      # Generate consolidated report
      generate_report() {
          log_info "Generating consolidated security report..."
          
          python3 /opt/zap/scripts/zap_report_generator.py \
              --input-dir "${REPORTS_DIR}/${TIMESTAMP}" \
              --output "${REPORTS_DIR}/${TIMESTAMP}/consolidated_security_report.html" \
              --format html
          
          log_success "Security report generated: ${REPORTS_DIR}/${TIMESTAMP}/consolidated_security_report.html"
      }
      
      # Send notifications
      send_notifications() {
          if [[ -f "${REPORTS_DIR}/${TIMESTAMP}/consolidated_security_report.html" ]]; then
              # Send to monitoring systems
              curl -X POST "http://{{ groups['prometheus'][0] }}:9093/api/v1/alerts" \
                  -H "Content-Type: application/json" \
                  -d '[{
                      "labels": {
                          "alertname": "SecurityScanCompleted",
                          "severity": "info",
                          "job": "security-scanner"
                      },
                      "annotations": {
                          "summary": "Security scan completed",
                          "description": "Comprehensive security scan completed at '"$TIMESTAMP"'"
                      }
                  }]' || log_warning "Failed to send alert notification"
          fi
      }
      
      # Main execution
      main() {
          log_info "Starting comprehensive DevOps Suite security scan"
          
          mkdir -p "${REPORTS_DIR}/${TIMESTAMP}"
          
          case "${1:-all}" in
              "web")
                  scan_web_applications
                  ;;
              "containers")
                  scan_containers
                  ;;
              "infrastructure")
                  audit_infrastructure
                  ;;
              "dependencies")
                  scan_dependencies
                  ;;
              "compliance")
                  check_compliance
                  ;;
              "all")
                  scan_web_applications
                  scan_containers
                  audit_infrastructure
                  scan_dependencies
                  check_compliance
                  generate_report
                  send_notifications
                  ;;
              *)
                  echo "Usage: $0 [web|containers|infrastructure|dependencies|compliance|all]"
                  exit 1
                  ;;
          esac
          
          log_success "Security scanning completed"
      }
      
      main "$@"
    dest: /opt/zap/scripts/comprehensive_security_scan.sh
    owner: zap
    group: zap
    mode: '0755'
  become: yes

- name: Setup automated security scanning with cron
  cron:
    name: "Comprehensive security scan"
    job: "/opt/zap/scripts/comprehensive_security_scan.sh all"
    minute: "0"
    hour: "4"
    day: "*"
    user: zap
  when: security_automated_scanning | default(true)

- name: Create security metrics collection
  copy:
    content: |
      #!/usr/bin/env python3
      """
      Security Metrics Collector
      Collects and exports security metrics to Prometheus
      """
      
      import json
      import time
      from prometheus_client import start_http_server, Gauge, Counter
      import os
      import glob
      from datetime import datetime, timedelta
      
      # Prometheus metrics
      security_vulnerabilities_total = Gauge('security_vulnerabilities_total', 'Total security vulnerabilities found', ['severity', 'service'])
      security_scans_total = Counter('security_scans_total', 'Total number of security scans performed', ['scan_type', 'status'])
      security_scan_duration = Gauge('security_scan_duration_seconds', 'Duration of security scans', ['scan_type'])
      compliance_score = Gauge('compliance_score_percentage', 'Compliance score percentage', ['standard'])
      
      class SecurityMetricsCollector:
          def __init__(self, reports_dir='/opt/zap/reports'):
              self.reports_dir = reports_dir
          
          def collect_vulnerability_metrics(self):
              """Collect vulnerability metrics from recent scan reports"""
              # Find recent reports (last 24 hours)
              cutoff_time = datetime.now() - timedelta(hours=24)
              
              for report_dir in glob.glob(f"{self.reports_dir}/*/"):
                  try:
                      dir_timestamp = os.path.basename(report_dir.rstrip('/'))
                      report_time = datetime.strptime(dir_timestamp, '%Y%m%d_%H%M%S')
                      
                      if report_time < cutoff_time:
                          continue
                      
                      # Process ZAP reports
                      for zap_report in glob.glob(f"{report_dir}/*_security_scan.json"):
                          self.process_zap_report(zap_report)
                      
                      # Process container scan reports
                      for container_report in glob.glob(f"{report_dir}/*_scan.json"):
                          if 'security_scan' not in container_report:
                              self.process_container_report(container_report)
                      
                      # Process compliance reports
                      compliance_report = f"{report_dir}/compliance_report.json"
                      if os.path.exists(compliance_report):
                          self.process_compliance_report(compliance_report)
                          
                  except Exception as e:
                      print(f"Error processing report directory {report_dir}: {e}")
          
          def process_zap_report(self, report_path):
              """Process ZAP scan report and update metrics"""
              try:
                  with open(report_path) as f:
                      report = json.load(f)
                  
                  service_name = os.path.basename(report_path).split('_')[0]
                  
                  # Count vulnerabilities by severity
                  severity_counts = {'high': 0, 'medium': 0, 'low': 0, 'info': 0}
                  
                  for vulnerability in report.get('vulnerabilities', []):
                      severity = vulnerability.get('severity', 'info').lower()
                      if severity in severity_counts:
                          severity_counts[severity] += 1
                  
                  # Update Prometheus metrics
                  for severity, count in severity_counts.items():
                      security_vulnerabilities_total.labels(
                          severity=severity, 
                          service=service_name
                      ).set(count)
                  
                  security_scans_total.labels(
                      scan_type='web_application', 
                      status='completed'
                  ).inc()
                  
              except Exception as e:
                  print(f"Error processing ZAP report {report_path}: {e}")
                  security_scans_total.labels(
                      scan_type='web_application', 
                      status='failed'
                  ).inc()
          
          def process_container_report(self, report_path):
              """Process container scan report and update metrics"""
              try:
                  with open(report_path) as f:
                      report = json.load(f)
                  
                  service_name = os.path.basename(report_path).split('_')[0]
                  
                  # Count vulnerabilities by severity
                  severity_counts = {'high': 0, 'medium': 0, 'low': 0, 'info': 0}
                  
                  for result in report.get('Results', []):
                      for vulnerability in result.get('Vulnerabilities', []):
                          severity = vulnerability.get('Severity', 'UNKNOWN').lower()
                          if severity in severity_counts:
                              severity_counts[severity] += 1
                  
                  # Update Prometheus metrics
                  for severity, count in severity_counts.items():
                      security_vulnerabilities_total.labels(
                          severity=severity, 
                          service=f"container_{service_name}"
                      ).set(count)
                  
                  security_scans_total.labels(
                      scan_type='container', 
                      status='completed'
                  ).inc()
                  
              except Exception as e:
                  print(f"Error processing container report {report_path}: {e}")
                  security_scans_total.labels(
                      scan_type='container', 
                      status='failed'
                  ).inc()
          
          def process_compliance_report(self, report_path):
              """Process compliance report and update metrics"""
              try:
                  with open(report_path) as f:
                      report = json.load(f)
                  
                  for standard, score in report.get('compliance_scores', {}).items():
                      compliance_score.labels(standard=standard).set(score)
                  
              except Exception as e:
                  print(f"Error processing compliance report {report_path}: {e}")
      
      def main():
          # Start Prometheus metrics server
          start_http_server(8889)
          print("Security metrics server started on port 8889")
          
          collector = SecurityMetricsCollector()
          
          while True:
              try:
                  collector.collect_vulnerability_metrics()
                  print(f"Metrics updated at {datetime.now()}")
                  time.sleep(300)  # Update every 5 minutes
              except KeyboardInterrupt:
                  break
              except Exception as e:
                  print(f"Error in metrics collection: {e}")
                  time.sleep(60)  # Wait 1 minute before retrying
      
      if __name__ == '__main__':
          main()
    dest: /opt/zap/scripts/security_metrics_collector.py
    owner: zap
    group: zap
    mode: '0755'
  become: yes

- name: Create security metrics systemd service
  copy:
    content: |
      [Unit]
      Description=Security Metrics Collector
      After=network.target
      
      [Service]
      Type=simple
      User=zap
      Group=zap
      WorkingDirectory=/opt/zap
      ExecStart=/usr/bin/python3 /opt/zap/scripts/security_metrics_collector.py
      Restart=always
      RestartSec=30
      
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/security-metrics.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart security-metrics
  become: yes

- name: Enable and start security metrics service
  systemd:
    name: security-metrics
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes