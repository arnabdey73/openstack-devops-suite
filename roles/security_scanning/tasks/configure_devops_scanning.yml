---
# DevOps Suite security scanning configuration

- name: Create DevOps Suite scan configurations
  template:
    src: devops_scan_config.json.j2
    dest: /opt/zap/config/devops_scan_config.json
    owner: zap
    group: zap
    mode: '0644'
  become: yes

- name: Configure target applications for scanning
  uri:
    url: "http://{{ zap_host }}:{{ zap_port }}/JSON/core/action/newSession/"
    method: GET
    status_code: [200]
  register: zap_session

- name: Add DevOps Suite targets to ZAP
  uri:
    url: "http://{{ zap_host }}:{{ zap_port }}/JSON/core/action/includeInContext/"
    method: GET
    body_format: form-urlencoded
    body:
      contextName: "DevOps Suite"
      regex: "{{ item.regex }}"
    status_code: [200]
  loop:
    - name: gitlab
      regex: "http://{{ groups['gitlab'][0] }}:8090/.*"
    - name: nexus
      regex: "http://{{ groups['nexus'][0] }}:8081/.*"
    - name: keycloak
      regex: "http://{{ groups['keycloak'][0] }}:8180/.*"
    - name: rancher
      regex: "https://{{ groups['rancher'][0] }}:8443/.*"
    - name: nginx
      regex: "http://{{ groups['nginx'][0] }}/.*"
    - name: grafana
      regex: "http://{{ groups['prometheus'][0] }}:3000/.*"
    - name: prometheus
      regex: "http://{{ groups['prometheus'][0] }}:9090/.*"

- name: Configure authentication for protected endpoints
  uri:
    url: "http://{{ zap_host }}:{{ zap_port }}/JSON/authentication/action/setAuthenticationMethod/"
    method: GET
    body_format: form-urlencoded
    body:
      contextId: "1"
      authMethodName: "formBasedAuthentication"
      authMethodConfigParams: "loginUrl={{ item.login_url }}&loginRequestData={{ item.login_data }}"
    status_code: [200]
  loop:
    - service: gitlab
      login_url: "http://{{ groups['gitlab'][0] }}:8090/users/sign_in"
      login_data: "user%5Blogin%5D={%username%}&user%5Bpassword%5D={%password%}"
    - service: nexus
      login_url: "http://{{ groups['nexus'][0] }}:8081/service/rapture/session"
      login_data: "username={%username%}&password={%password%}"
    - service: grafana
      login_url: "http://{{ groups['prometheus'][0] }}:3000/login"
      login_data: "user={%username%}&password={%password%}"
  when: zap_authenticated_scanning | default(true)

- name: Set up scan policies for different service types
  copy:
    content: "{{ item.policy | to_nice_json }}"
    dest: "/opt/zap/policies/{{ item.service }}_policy.json"
    owner: zap
    group: zap
    mode: '0644'
  loop:
    - service: web_applications
      policy:
        name: "Web Application Security Policy"
        description: "Standard web application security testing policy"
        scanner:
          level: "MEDIUM"
          strength: "MEDIUM"
        rules:
          - id: 10012  # Password Autocomplete in browser
            level: "LOW"
          - id: 10021  # X-Content-Type-Options header missing
            level: "LOW"
          - id: 10023  # Information Disclosure - Debug Error Messages
            level: "MEDIUM"
          - id: 10025  # Information Disclosure - Sensitive Information in URL
            level: "MEDIUM"
          - id: 10026  # HTTP Parameter Override
            level: "MEDIUM"
    - service: api_endpoints
      policy:
        name: "API Security Policy"
        description: "REST API security testing policy"
        scanner:
          level: "HIGH"
          strength: "HIGH"
        rules:
          - id: 90019  # Code Injection
            level: "HIGH"
          - id: 90020  # Remote OS Command Injection
            level: "HIGH"
          - id: 90021  # XPath Injection
            level: "HIGH"
          - id: 90022  # Application Error Disclosure
            level: "MEDIUM"
          - id: 90023  # XML External Entity Attack
            level: "HIGH"
  become: yes

- name: Create custom security testing scripts for DevOps Suite
  template:
    src: "{{ item }}.j2"
    dest: "/opt/zap/scripts/{{ item }}"
    owner: zap
    group: zap
    mode: '0755'
  loop:
    - scan_gitlab.py
    - scan_nexus.py
    - scan_keycloak.py
    - scan_rancher.py
    - scan_monitoring.py
  become: yes

- name: Setup automated scanning schedules
  cron:
    name: "{{ item.name }}"
    job: "{{ item.job }}"
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    day: "{{ item.day | default('*') }}"
    user: zap
  loop:
    - name: "Daily baseline scan"
      job: "/opt/zap/scripts/zap_baseline_scan.py --config /opt/zap/config/devops_scan_config.json"
      minute: "0"
      hour: "2"
    - name: "Weekly full security scan"
      job: "/opt/zap/scripts/zap_full_scan.py --config /opt/zap/config/devops_scan_config.json"
      minute: "0"
      hour: "1"
      day: "0"
    - name: "API security scan"
      job: "/opt/zap/scripts/zap_api_scan.py --config /opt/zap/config/devops_scan_config.json"
      minute: "30"
      hour: "3"
  when: zap_automated_scanning | default(true)