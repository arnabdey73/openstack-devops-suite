---
# ArgoCD GitOps Configuration for DevOps Suite

# ArgoCD Configuration
argocd:
  version: "v2.8.4"
  namespace: "argocd"
  
  # Server configuration
  server:
    host: "{{ ansible_default_ipv4.address }}"
    port: 8080
    grpc_port: 443
    insecure: true  # Set to false for production with TLS
    
  # Admin credentials
  admin:
    password: "{{ argocd_admin_password | default('admin123') }}"
    
  # Repository configuration
  repositories:
    - name: "devops-suite-configs"
      url: "{{ gitlab_url | default('http://localhost:8090') }}/devops/k8s-configs.git"
      type: "git"
      username: "{{ gitlab_username | default('root') }}"
      password: "{{ gitlab_password | default('password') }}"
      
  # Application projects
  projects:
    - name: "devops-suite"
      description: "DevOps Suite Applications"
      source_repos:
        - "{{ gitlab_url | default('http://localhost:8090') }}/devops/*"
        - "https://charts.bitnami.com/bitnami"
        - "https://prometheus-community.github.io/helm-charts"
        - "https://grafana.github.io/helm-charts"
      destinations:
        - namespace: "devops-*"
          server: "https://kubernetes.default.svc"
        - namespace: "monitoring"
          server: "https://kubernetes.default.svc"
        - namespace: "logging" 
          server: "https://kubernetes.default.svc"
        - namespace: "security"
          server: "https://kubernetes.default.svc"

# GitOps Applications Configuration
gitops_applications:
  - name: "prometheus-stack"
    project: "devops-suite"
    source:
      repoURL: "https://prometheus-community.github.io/helm-charts"
      chart: "kube-prometheus-stack"
      targetRevision: "51.2.0"
    destination:
      server: "https://kubernetes.default.svc"
      namespace: "monitoring"
    values:
      prometheus:
        prometheusSpec:
          retention: "30d"
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: "standard"
                resources:
                  requests:
                    storage: "20Gi"
      grafana:
        enabled: true
        adminPassword: "{{ grafana_admin_password | default('admin123') }}"
        
  - name: "jaeger-operator"
    project: "devops-suite"
    source:
      repoURL: "https://jaegertracing.github.io/helm-charts"
      chart: "jaeger-operator"
      targetRevision: "2.47.0"
    destination:
      server: "https://kubernetes.default.svc"
      namespace: "tracing"
      
  - name: "elasticsearch-operator"
    project: "devops-suite"
    source:
      repoURL: "https://helm.elastic.co"
      chart: "eck-operator"
      targetRevision: "2.9.0"
    destination:
      server: "https://kubernetes.default.svc"
      namespace: "logging"

# Helm Chart Templates for Common Patterns
helm_chart_templates:
  - name: "microservice-template"
    description: "Standard microservice deployment template"
    includes:
      - deployment
      - service
      - ingress
      - configmap
      - secret
      - hpa
      - pdb
      
  - name: "database-template"
    description: "Database deployment template with persistent storage"
    includes:
      - statefulset
      - service
      - configmap
      - secret
      - pvc
      - networkpolicy
      
  - name: "batch-job-template"
    description: "Batch job processing template"
    includes:
      - job
      - cronjob
      - configmap
      - secret

# GitOps Workflow Configuration
gitops_workflows:
  - name: "development"
    auto_sync: true
    auto_prune: true
    self_heal: true
    sync_policy:
      automated:
        prune: true
        selfHeal: true
        allowEmpty: false
      syncOptions:
        - "Validate=true"
        - "CreateNamespace=true"
        - "PrunePropagationPolicy=foreground"
        - "PruneLast=true"
        
  - name: "staging"
    auto_sync: false
    manual_approval: true
    
  - name: "production"
    auto_sync: false
    manual_approval: true
    require_review: true

# RBAC Configuration
argocd_rbac:
  policy: |
    g, argocd-admins, role:admin
    g, devops-developers, role:readonly
    g, devops-operators, role:admin
  scopes: '[groups]'

# Notifications Configuration
argocd_notifications:
  enabled: true
  slack:
    webhook_url: "{{ slack_webhook_url | default('') }}"
    channel: "{{ slack_channel | default('#devops') }}"
  email:
    enabled: true
    smtp_server: "{{ smtp_server | default('localhost:587') }}"
    from: "{{ argocd_email_from | default('argocd@devops-suite.local') }}"

# Application Health Checks
health_checks:
  enabled: true
  checks:
    - name: "prometheus"
      url: "http://prometheus-server.monitoring.svc.cluster.local:9090/-/ready"
    - name: "grafana"  
      url: "http://grafana.monitoring.svc.cluster.local:3000/api/health"
    - name: "jaeger"
      url: "http://jaeger-query.tracing.svc.cluster.local:16686/"

# Resource Management
resource_management:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
    
# Security Policies
security_policies:
  pod_security_standards: "restricted"
  network_policies: true
  admission_controllers:
    - "PodSecurityPolicy"
    - "NetworkPolicy"
    - "ResourceQuota"
    - "LimitRange"

# Service configuration
argocd_service_enabled: true
argocd_service_state: "started"