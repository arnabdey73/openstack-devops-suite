---
# Jaeger Distributed Tracing Configuration for DevOps Suite

# Jaeger All-in-One Configuration (for development/single-node deployments)
jaeger:
  version: "1.50.0"
  user: "jaeger"
  group: "jaeger"
  home_dir: "/opt/jaeger"
  config_dir: "/etc/jaeger"
  data_dir: "/var/lib/jaeger"
  log_dir: "/var/log/jaeger"
  
  # Service ports
  ui_port: 16686              # Jaeger UI
  collector_grpc_port: 14250   # gRPC collector
  collector_http_port: 14268   # HTTP collector
  agent_compact_port: 6831     # Jaeger agent (compact thrift)
  agent_binary_port: 6832      # Jaeger agent (binary thrift)  
  agent_config_port: 5778      # Agent config
  zipkin_port: 9411           # Zipkin compatible endpoint
  
  # Storage configuration
  storage_type: "memory"  # Options: memory, elasticsearch, cassandra, kafka
  
  # Memory storage settings (for development)
  memory:
    max_traces: 50000
    
  # Elasticsearch storage settings (for production)
  elasticsearch:
    server_urls: "http://localhost:9200"
    username: ""
    password: ""
    index_prefix: "jaeger"
    
  # Query service settings
  query:
    base_path: "/"
    ui_config: "/etc/jaeger/ui-config.json"
    
  # Collector settings
  collector:
    grpc_tls_enabled: false
    http_tls_enabled: false
    
# Jaeger Agent Configuration (deployed on each host)
jaeger_agent:
  reporter:
    grpc:
      host_port: "localhost:{{ jaeger.collector_grpc_port }}"
    type: "grpc"
  processor:
    jaeger_compact:
      server_host_port: "{{ jaeger.agent_compact_port }}"
    jaeger_binary:
      server_host_port: "{{ jaeger.agent_binary_port }}"

# OpenTelemetry Collector Configuration  
otel_collector:
  enabled: true
  version: "0.88.0"
  config_dir: "/etc/otelcol"
  data_dir: "/var/lib/otelcol"
  
  # Receivers configuration
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    jaeger:
      protocols:
        grpc:
          endpoint: "0.0.0.0:14250"
        thrift_http:
          endpoint: "0.0.0.0:14268"
        thrift_compact:
          endpoint: "0.0.0.0:6831"
    zipkin:
      endpoint: "0.0.0.0:9411"
      
  # Exporters configuration  
  exporters:
    jaeger:
      endpoint: "localhost:14250"
      tls:
        insecure: true
    prometheus:
      endpoint: "0.0.0.0:8889"
      
# Service instrumentation configuration
service_instrumentation:
  gitlab:
    enabled: true
    service_name: "gitlab"
    jaeger_agent_host: "localhost"
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.1
    
  nexus:
    enabled: true
    service_name: "nexus"
    jaeger_agent_host: "localhost"
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.1
    
  keycloak:
    enabled: true
    service_name: "keycloak"
    jaeger_agent_host: "localhost"
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.1
    
  nginx:
    enabled: true
    service_name: "nginx-proxy"
    jaeger_agent_host: "localhost"
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.05
    
  kafka:
    enabled: true
    service_name: "kafka"
    jaeger_agent_host: "localhost"
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.1
    
  redis:
    enabled: true
    service_name: "redis"
    jaeger_agent_host: "localhost" 
    jaeger_agent_port: "{{ jaeger.agent_compact_port }}"
    sampling_rate: 0.1

# Jaeger UI configuration
jaeger_ui:
  dependencies:
    menuEnabled: true
  tracking:
    gaID: ""
  menu:
    - label: "About Jaeger"
      url: "https://jaegertracing.io/"
    - label: "Documentation" 
      url: "https://jaegertracing.io/docs/"

# Security and networking
jaeger_security:
  enable_tls: false
  cert_file: ""
  key_file: ""
  client_ca_file: ""

# Service configuration
jaeger_service_enabled: true
jaeger_service_state: "started"

# Hot R.O.D. demo application (optional)
hotrod_demo:
  enabled: false
  port: 8080