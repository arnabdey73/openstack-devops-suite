---
# Jaeger Distributed Tracing Installation and Configuration

- name: Create jaeger system group
  group:
    name: "{{ jaeger.group }}"
    system: true
    state: present

- name: Create jaeger system user
  user:
    name: "{{ jaeger.user }}"
    system: true
    shell: "/bin/false"
    group: "{{ jaeger.group }}"
    createhome: false
    home: "{{ jaeger.home_dir }}"
    state: present

- name: Create jaeger directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jaeger.user }}"
    group: "{{ jaeger.group }}"
    mode: '0755'
  loop:
    - "{{ jaeger.home_dir }}"
    - "{{ jaeger.config_dir }}"
    - "{{ jaeger.data_dir }}"
    - "{{ jaeger.log_dir }}"
    - "{{ jaeger.home_dir }}/bin"

- name: Download Jaeger All-in-One binary
  get_url:
    url: "https://github.com/jaegertracing/jaeger/releases/download/v{{ jaeger.version }}/jaeger-{{ jaeger.version }}-linux-amd64.tar.gz"
    dest: "/tmp/jaeger-{{ jaeger.version }}-linux-amd64.tar.gz"
    mode: '0644'
  register: jaeger_download

- name: Extract Jaeger binaries
  unarchive:
    src: "/tmp/jaeger-{{ jaeger.version }}-linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: true
    creates: "/tmp/jaeger-{{ jaeger.version }}-linux-amd64"
  when: jaeger_download.changed

- name: Copy Jaeger binaries
  copy:
    src: "/tmp/jaeger-{{ jaeger.version }}-linux-amd64/{{ item }}"
    dest: "{{ jaeger.home_dir }}/bin/{{ item }}"
    mode: '0755'
    owner: "{{ jaeger.user }}"
    group: "{{ jaeger.group }}"
    remote_src: true
  loop:
    - jaeger-all-in-one
    - jaeger-agent
    - jaeger-collector
    - jaeger-query
  when: jaeger_download.changed

- name: Create Jaeger binary symlinks
  file:
    src: "{{ jaeger.home_dir }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - jaeger-all-in-one
    - jaeger-agent
    - jaeger-collector
    - jaeger-query

- name: Install OpenTelemetry Collector (optional)
  include_tasks: otel_collector.yml
  when: otel_collector.enabled

- name: Generate Jaeger UI configuration
  template:
    src: ui-config.json.j2
    dest: "{{ jaeger.config_dir }}/ui-config.json"
    owner: "{{ jaeger.user }}"
    group: "{{ jaeger.group }}"
    mode: '0644'

- name: Create Jaeger All-in-One systemd service
  template:
    src: jaeger-all-in-one.service.j2
    dest: /etc/systemd/system/jaeger-all-in-one.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart jaeger

- name: Create Jaeger Agent systemd service
  template:
    src: jaeger-agent.service.j2
    dest: /etc/systemd/system/jaeger-agent.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - reload systemd
    - restart jaeger-agent

- name: Enable and start Jaeger services
  systemd:
    name: "{{ item }}"
    enabled: "{{ jaeger_service_enabled }}"
    state: "{{ jaeger_service_state }}"
    daemon_reload: true
  loop:
    - jaeger-all-in-one
    - jaeger-agent

- name: Configure firewall for Jaeger
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "Jaeger Tracing"
  loop:
    - "{{ jaeger.ui_port }}"
    - "{{ jaeger.collector_grpc_port }}"
    - "{{ jaeger.collector_http_port }}"
    - "{{ jaeger.zipkin_port }}"
  when: ansible_os_family == "Debian"

- name: Configure firewall for Jaeger UDP ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    comment: "Jaeger Agent"
  loop:
    - "{{ jaeger.agent_compact_port }}"
    - "{{ jaeger.agent_binary_port }}"
  when: ansible_os_family == "Debian"

- name: Install Hot R.O.D. demo application
  include_tasks: hotrod_demo.yml
  when: hotrod_demo.enabled

- name: Wait for Jaeger UI to be available
  uri:
    url: "http://localhost:{{ jaeger.ui_port }}"
    method: GET
    status_code: 200
  register: jaeger_health
  until: jaeger_health.status == 200
  retries: 30
  delay: 5

- name: Configure service instrumentation
  include_tasks: service_instrumentation.yml

- name: Display Jaeger tracing information
  debug:
    msg: |
      🔍 Jaeger Distributed Tracing deployed successfully!
      
      Services:
      - Jaeger UI: http://{{ ansible_default_ipv4.address }}:{{ jaeger.ui_port }}
      - OTLP gRPC: {{ ansible_default_ipv4.address }}:4317
      - OTLP HTTP: {{ ansible_default_ipv4.address }}:4318
      - Jaeger Collector gRPC: {{ ansible_default_ipv4.address }}:{{ jaeger.collector_grpc_port }}
      - Jaeger Collector HTTP: {{ ansible_default_ipv4.address }}:{{ jaeger.collector_http_port }}
      - Zipkin Compatible: {{ ansible_default_ipv4.address }}:{{ jaeger.zipkin_port }}
      
      Agent Endpoints:
      - Compact Thrift: {{ ansible_default_ipv4.address }}:{{ jaeger.agent_compact_port }}
      - Binary Thrift: {{ ansible_default_ipv4.address }}:{{ jaeger.agent_binary_port }}
      - Config: {{ ansible_default_ipv4.address }}:{{ jaeger.agent_config_port }}
      
      Instrumentation configured for all DevOps Suite services.
      Access the Jaeger UI to view distributed traces.