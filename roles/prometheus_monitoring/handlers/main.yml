---
# Prometheus Monitoring Handlers

- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart prometheus
  systemd:
    name: prometheus
    state: restarted
    enabled: true

- name: restart alertmanager
  systemd:
    name: alertmanager
    state: restarted
    enabled: true

- name: restart node_exporter
  systemd:
    name: node_exporter
    state: restarted
    enabled: true

- name: restart blackbox_exporter
  systemd:
    name: blackbox_exporter
    state: restarted
    enabled: true