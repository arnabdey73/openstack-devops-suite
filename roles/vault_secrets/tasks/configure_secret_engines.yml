---
# Vault secret engines configuration

- name: Enable KV v2 secrets engine for general secrets
  uri:
    url: "{{ vault_api_url }}/sys/mounts/secret"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
      description: "General purpose KV store for DevOps Suite secrets"
    status_code: [200, 204, 400]

- name: Enable database secrets engine
  uri:
    url: "{{ vault_api_url }}/sys/mounts/database"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: database
      description: "Dynamic database credentials for DevOps Suite"
    status_code: [200, 204, 400]

- name: Enable PKI secrets engine for certificates
  uri:
    url: "{{ vault_api_url }}/sys/mounts/pki"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: pki
      config:
        max_lease_ttl: "8760h"  # 1 year
      description: "PKI engine for SSL certificates"
    status_code: [200, 204, 400]

- name: Enable SSH secrets engine
  uri:
    url: "{{ vault_api_url }}/sys/mounts/ssh"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: ssh
      description: "SSH certificate authority"
    status_code: [200, 204, 400]

- name: Enable transit secrets engine for encryption
  uri:
    url: "{{ vault_api_url }}/sys/mounts/transit"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: transit
      description: "Encryption as a service for DevOps Suite"
    status_code: [200, 204, 400]

- name: Configure database connections
  uri:
    url: "{{ vault_api_url }}/database/config/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      plugin_name: "{{ item.plugin }}"
      connection_url: "{{ item.connection_url }}"
      allowed_roles: "{{ item.allowed_roles }}"
      username: "{{ item.username }}"
      password: "{{ item.password }}"
    status_code: [200, 204]
  loop:
    - name: gitlab-db
      plugin: mysql-database-plugin
      connection_url: "{{username}}:{{password}}@tcp({{ mysql_host }}:3306)/gitlab"
      allowed_roles: ["gitlab-role"]
      username: "{{ mysql_vault_user }}"
      password: "{{ mysql_vault_password }}"
    - name: keycloak-db
      plugin: postgresql-database-plugin
      connection_url: "postgresql://{{username}}:{{password}}@{{ postgresql_host }}:5432/keycloak?sslmode=disable"
      allowed_roles: ["keycloak-role"]
      username: "{{ postgresql_vault_user }}"
      password: "{{ postgresql_vault_password }}"
  no_log: true
  when: vault_configure_databases | default(true)

- name: Create database roles
  uri:
    url: "{{ vault_api_url }}/database/roles/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      db_name: "{{ item.db_name }}"
      creation_statements: "{{ item.creation_statements }}"
      default_ttl: "{{ item.default_ttl | default('1h') }}"
      max_ttl: "{{ item.max_ttl | default('24h') }}"
    status_code: [200, 204]
  loop:
    - name: gitlab-role
      db_name: gitlab-db
      creation_statements: ["CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}';GRANT SELECT,INSERT,UPDATE,DELETE ON gitlab.* TO '{{name}}'@'%';"]
    - name: keycloak-role
      db_name: keycloak-db
      creation_statements: ["CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";"]
  when: vault_configure_databases | default(true)

- name: Generate root CA certificate
  uri:
    url: "{{ vault_api_url }}/pki/root/generate/internal"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      common_name: "DevOps Suite Root CA"
      ttl: "8760h"  # 1 year
      key_bits: 4096
      organization: "{{ organization_name | default('DevOps Suite') }}"
      country: "{{ organization_country | default('US') }}"
    status_code: [200, 204]
  register: root_ca_result

- name: Configure PKI URLs
  uri:
    url: "{{ vault_api_url }}/pki/config/urls"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      issuing_certificates: "{{ vault_api_url }}/pki/ca"
      crl_distribution_points: "{{ vault_api_url }}/pki/crl"
    status_code: [200, 204]

- name: Create PKI role for DevOps Suite services
  uri:
    url: "{{ vault_api_url }}/pki/roles/devops-suite"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      allowed_domains: "{{ vault_allowed_domains }}"
      allow_subdomains: true
      max_ttl: "720h"  # 30 days
      generate_lease: true
      key_bits: 2048
    status_code: [200, 204]

- name: Configure SSH CA
  uri:
    url: "{{ vault_api_url }}/ssh/config/ca"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      generate_signing_key: true
    status_code: [200, 204]

- name: Create SSH role for server access
  uri:
    url: "{{ vault_api_url }}/ssh/roles/server-access"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      key_type: ca
      allow_user_certificates: true
      allowed_users: "ubuntu,root,ansible"
      default_extensions:
        permit-pty: ""
        permit-user-rc: ""
      ttl: "30m"
      max_ttl: "90m"
    status_code: [200, 204]

- name: Create encryption key in transit engine
  uri:
    url: "{{ vault_api_url }}/transit/keys/devops-suite"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      type: "aes256-gcm96"
    status_code: [200, 204, 400]